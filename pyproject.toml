[project]
name = "telethon-mcp-server"
version = "0.1.0"
description = "Personal MCP server for Telegram via Telethon"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "telethon>=1.42",
    "mcp[cli]>=1.6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
telethon-mcp = "telethon_mcp.server:main"
telethon-mcp-auth = "telethon_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telethon_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
