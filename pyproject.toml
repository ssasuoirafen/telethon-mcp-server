[project]
name = "telethon-mcp-server"
version = "0.1.3"
description = "Personal MCP server for Telegram via Telethon"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Upper bound is mandatory: Telethon migrates the SQLite session schema in
    # place (v7 -> v8 added tmp_auth_key) and the migration is one-way, so an
    # unpinned floor let dev (locked 1.42) and uvx (resolved 1.44) fight over the
    # same ~/.telethon-mcp-session file. Re-check the session schema before widening.
    "telethon>=1.44,<2",
    # Major bound is mandatory: mcp 2.0 renamed FastMCP to MCPServer and moved it
    # from mcp.server.fastmcp to mcp.server.mcpserver. Without an upper bound the
    # next major can break the import the same way - re-check the API before widening.
    "mcp[cli]>=2.0.0,<3",
    "pydantic>=2.0.0",
]

[project.scripts]
telethon-mcp = "telethon_mcp.server:main"
telethon-mcp-auth = "telethon_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telethon_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
