name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Lint (advisory - flip to blocking once source lint is cleaned)
        run: uv run ruff check . --exit-zero
      - name: Test
        run: uv run pytest -q

  # Releases are consumed as `uvx --from git+https://...@vX.Y.Z`, so a tag that
  # disagrees with the packaged version ships a misleading version to clients.
  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Tag must match the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(uv version --short)"
          if [ "$tag" != "$proj" ]; then
            echo "tag $tag does not match pyproject version $proj"
            exit 1
          fi
